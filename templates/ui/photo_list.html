<div class="qr-photo-list">
  {% for photo in photos %}<figure class="qr-photo-tile">
    {% if photo.url %}<a href="{{ photo.url }}"{% if photo.thumbnail %} data-photo-lightbox="{{ photo.thumbnail }}" data-photo-label="{{ photo.label }}"{% endif %}>{% if photo.thumbnail %}<img src="{{ photo.thumbnail }}" alt="{{ photo.label }}" loading="lazy" data-private-photo><span data-photo-unavailable hidden>Prévia indisponível. Abra a foto para conferir.</span>{% else %}<span>{{ photo.label }}</span>{% endif %}</a>{% else %}<p>{{ photo.label }} — indisponível</p>{% endif %}
    {% if photo.caption %}<figcaption class="form-text">{{ photo.caption }}</figcaption>{% endif %}
  </figure>{% empty %}<p class="qr-muted">{{ empty_text|default:'Nenhuma foto enviada.' }}</p>{% endfor %}
</div>
