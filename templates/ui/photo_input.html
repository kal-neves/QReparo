<div class="qr-photo-input qr-stack" data-photo-input data-max-bytes="{{ max_bytes|default:10485760 }}">
  {% include 'ui/field.html' with field=field only %}
  <p class="form-text" data-photo-status role="status"></p>
  <img class="qr-photo-preview" data-photo-preview alt="Prévia local da foto selecionada" hidden>
  <button class="btn btn-outline-primary" type="button" data-photo-remove hidden>Remover seleção<span class="visually-hidden"> — {{ field.label }}</span></button>
</div>
